services:
  printer:
    build: .
    container_name: printer-web-hub
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./scans:/app/scans
      - /var/run/cups/cups.sock:/var/run/cups/cups.sock:ro
    environment:
      # Optional: toggle printing / scanning features (default: true)
      # - ENABLE_PRINTING=false
      # - ENABLE_SCANNING=true
      - CUPS_SERVER=/var/run/cups/cups.sock
      # Auto-discovery enabled by default (true). Set to false if using static IP only:
      - AUTO_DISCOVER=true
      # Optional: specify static scanner IP/host (bypasses network scanning if AUTO_DISCOVER=false)
      # - SCANNER_IP=[IP_ADDRESS]
      # Optional: override default CUPS printer destination queue
      # - DEFAULT_PRINTER=My_Printer_Queue
      # Optional: enable password protection (leave commented for open LAN access)
      # - AUTH_USERNAME=admin
      # - AUTH_PASSWORD=secretpassword

